.maplibregl-popup{max-width:330px!important}.maplibregl-popup-content{padding:0!important;overflow:hidden;border-radius:26px!important;background:rgba(250,250,252,.94)!important;border:1px solid rgba(255,255,255,.88)!important;box-shadow:0 24px 70px rgba(15,23,42,.22)!important;backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}

/* v3.3 — Smartphone UI */
@media (max-width:700px){
  html,body,#map{height:100dvh;min-height:100dvh;overflow:hidden}
  body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #map{touch-action:none}

  #panel,#panel.closed{
    left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));top:auto;width:auto;
    padding:20px 14px 14px;border-radius:28px;max-height:min(68dvh,620px);
    background:rgba(248,248,250,.84);box-shadow:0 18px 55px rgba(15,23,42,.18),0 1px 0 rgba(255,255,255,.7) inset;
    transition:max-height .32s cubic-bezier(.2,.8,.2,1),padding .32s ease,transform .32s ease;
  }
  #panel:before{content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:999px;background:rgba(60,60,67,.22)}

  #panel.closed h2,#panel.closed #filterList,#panel.closed #metaText{display:none}
  #panel h1{font-size:20px;line-height:1.08;letter-spacing:-.55px;padding-right:0;margin-top:3px}
  #panel>p{font-size:11px;line-height:1.25;margin:4px 0 10px;color:#7b818b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #openSearch{height:44px;border-radius:14px;padding:0 14px;font-size:13px;box-shadow:inset 0 0 0 1px rgba(20,25,35,.06),0 3px 12px rgba(20,25,35,.05)}
  #openSearch:before{font-size:19px;margin-right:8px}
  #searchBox{gap:6px;margin-top:8px}
  #searchInput{height:44px;font-size:16px;border-radius:14px;padding:0 12px} /* 16px prevents iOS zoom */
  #doSearch,#closeSearch{height:44px;padding:0 11px;border-radius:14px}
  #closeSearch{font-size:19px}
  #searchSuggestions{position:fixed;left:12px;right:12px;top:auto;bottom:calc(146px + env(safe-area-inset-bottom));max-height:42dvh;border-radius:20px;padding:6px;z-index:80}
  .suggestion{padding:12px 12px;border-radius:14px;font-size:13px;min-height:48px}
  #panel h2{font-size:11px;margin:16px 3px 8px}
  #filterList{grid-template-columns:1fr 1fr;gap:7px;padding-bottom:2px}
  .borgo{min-height:48px;padding:9px 10px;border-radius:15px;font-size:11px}.dot{width:11px;height:11px}
  #metaText{font-size:9.5px;margin-top:10px;padding-top:9px}

  /* On phones, pinch zoom is more natural: keep only the recenter control. */
  #zoomInBtn,#zoomOutBtn{display:none}
  #locateBtn{top:calc(10px + env(safe-area-inset-top));right:10px;width:46px;height:46px;border-radius:15px;font-size:20px}
  #toggleMenu{left:auto;right:16px;top:auto;bottom:calc(145px + env(safe-area-inset-bottom));height:36px;min-width:68px;padding:0 13px;border-radius:999px;font-size:12px;box-shadow:0 8px 24px rgba(15,23,42,.15)}
  #panel:not(.closed)~#toggleMenu{bottom:calc(min(68dvh,620px) + 18px + env(safe-area-inset-bottom))}

  #toast{left:12px;right:12px;bottom:calc(148px + env(safe-area-inset-bottom));transform:none;max-width:none;width:auto;text-align:center;padding:10px 13px;font-size:11px;line-height:1.25}

  /* Civic info becomes a native-feeling bottom card instead of a tiny map bubble. */
  .maplibregl-popup{position:fixed!important;left:8px!important;right:8px!important;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;transform:none!important;width:auto!important;max-width:none!important;z-index:60!important}
  .maplibregl-popup-tip{display:none!important}
  .maplibregl-popup-content{width:100%!important;border-radius:28px!important;box-shadow:0 20px 65px rgba(15,23,42,.24)!important}
  .civic-card{min-width:0;width:100%}
  .civic-card-head{padding:19px 50px 13px 18px}
  .civic-title{font-size:20px}.civic-address{font-size:13px}.civic-card-body{padding:12px 18px calc(15px + env(safe-area-inset-bottom));gap:7px}
  .civic-chip{font-size:11px;padding:7px 9px}.civic-note{font-size:10px}
  .maplibregl-popup-close-button{right:10px!important;top:10px!important;width:32px;height:32px;line-height:30px!important}
}
@media (max-width:380px){

@media (max-width:700px){
  /* Keep Borghi reachable even while a borgo is focused. */

function parseSource(html){
  const out=new Map();
  // La mappa originale usa: const DATA = [{via,civ,lat,lon,borgo,key}, ...];
  // Gli spazi attorno a '=' possono variare: non assumiamo una formattazione precisa.
  const m=html.match(/(?:const|let|var)\s+DATA\s*=\s*(\[[\s\S]*?\])\s*;/);
  if(!m){
    const pos=html.indexOf('DATA');
    throw Error('DATA non trovata nell’HTML definitivo (posizione: '+pos+')');
  }
  let data;
  try{ data=JSON.parse(m[1]); }catch(e){ throw Error('DATA trovata ma non è JSON valido: '+e.message); }
  for(const r of data){
    if(!r) continue;
    const via=r.via ?? r.Via;
    const civ=r.civ ?? r.Civico ?? r.civico;
    const lat=Number(r.lat ?? r.latitude);
    const lon=Number(r.lon ?? r.lng ?? r.longitude);
    if(via && civ && Number.isFinite(lat) && Number.isFinite(lon)) out.set(key(via,civ),[lon,lat]);
  }
  htmlRows=data.filter(Boolean).map(r=>({via:r.via??r.Via??'',civico:r.civ??r.Civico??r.civico??'',lat:Number(r.lat??r.latitude),lon:Number(r.lon??r.lng??r.longitude)})).filter(r=>r.via&&r.civico&&Number.isFinite(r.lat)&&Number.isFinite(r.lon));
  return out;
}
function expandStreetRules(){
  const explicit=new Set(records.map(r=>key(viaOf(r),civOf(r))));
  const ruleMap=new Map(STREET_RULES.map(r=>[norm(r.via),r]));
  let added=0;
  for(const h of htmlRows){
    const k=key(h.via,h.civico); if(explicit.has(k)) continue;
    const rule=ruleMap.get(norm(h.via)); if(!rule) continue;
    records.push({via:h.via,civico:String(h.civico),borgo:canonBorgo(rule.borgo),note:rule.note||'Assegnazione da regola di via',ragionamento:rule.ragionamento||'',derivedFromStreet:true});
    explicit.add(k); added++;
  }
  expandedFromStreet=added;
}

function pointSegDistLonLat(p,a,b){
  const lat0=(p[1]+a[1]+b[1])/3*Math.PI/180, kx=Math.cos(lat0);
  const ax=a[0]*kx, ay=a[1], bx=b[0]*kx, by=b[1], px=p[0]*kx, py=p[1];
  const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c2=vx*vx+vy*vy,t=c2?Math.max(0,Math.min(1,(vx*wx+vy*wy)/c2)):0;
  return Math.hypot(px-(ax+t*vx),py-(ay+t*vy))*111320;
}
function ringContains(p,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    const hit=((yi>p[1])!==(yj>p[1])) && (p[0] < (xj-xi)*(p[1]-yi)/(yj-yi||1e-12)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}
function polygonContains(p,poly){
  if(!poly?.length||!ringContains(p,poly[0]))return false;
  for(let i=1;i<poly.length;i++) if(ringContains(p,poly[i])) return false;
  return true;
}
function geometryContains(p,g){
  if(!g)return false;
  if(g.type==='Polygon')return polygonContains(p,g.coordinates);
  if(g.type==='MultiPolygon')return g.coordinates.some(poly=>polygonContains(p,poly));
  return false;
}
function geometryDistanceMeters(p,g){
  if(!g)return 1e9;
  let best=1e9;
  const polys=g.type==='Polygon'?[g.coordinates]:(g.type==='MultiPolygon'?g.coordinates:[]);
  for(const poly of polys) for(const ring of poly) for(let i=0;i<ring.length;i++) best=Math.min(best,pointSegDistLonLat(p,ring[i],ring[(i+1)%ring.length]));
  return best;
}
function getBuildingCandidates(point){
  // Usa direttamente le geometrie del source OpenMapTiles già caricate, non i pixel renderizzati.
  // In questo modo il match non dipende dalla prospettiva 3D o dalla posizione sullo schermo.
  const fs=map.querySourceFeatures('openmaptiles',{sourceLayer:'building'})||[];
  const seen=new Map();
  for(const f of fs){
    const id=String(f.id??f.properties?.osm_id??'');
    if(id&&!seen.has(id))seen.set(id,f);
  }
  const candidates=[...seen.values()];
  const containing=candidates.filter(f=>geometryContains(point,f.geometry));
  if(containing.length)return containing;
  return candidates.filter(f=>geometryDistanceMeters(point,f.geometry)<=18).sort((a,b)=>geometryDistanceMeters(point,a.geometry)-geometryDistanceMeters(point,b.geometry)).slice(0,4);
}
async function fetchBrandizzoBuildings(){
  // v3.8: niente Overpass a runtime. Usiamo le geometrie building già presenti
  // nelle tile OpenMapTiles/OpenFreeMap caricate dalla mappa, eliminando i 504.
  // fitMatched() inquadra prima tutti i civici di Brandizzo, quindi le tile utili
  // sono già in memoria quando parte questo passaggio.
  if(!map.isSourceLoaded('openmaptiles')){
    await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve()};map.once('idle',finish);setTimeout(finish,3500)});
  }
  const fs=map.querySourceFeatures('openmaptiles',{sourceLayer:'building'})||[];
  const out=[], seen=new Set(); let n=0;
  for(const f of fs){
    if(!f?.geometry || !['Polygon','MultiPolygon'].includes(f.geometry.type))continue;
    // Le feature possono comparire in più tile. Manteniamo geometrie distinte ma
    // scartiamo duplicati esatti, così non perdiamo frammenti ai bordi delle tile.
    const osm=String(f.id??f.properties?.osm_id??'b');
    const sig=osm+'|'+JSON.stringify(f.geometry.coordinates);
    if(seen.has(sig))continue; seen.add(sig);
    out.push({id:osm+'_'+(n++),geometry:f.geometry,properties:f.properties||{}});
  }
  // Le tile possono non essere ancora pronte, soprattutto su smartphone/rete lenta.
  // Non è un errore: restituiamo un array vuoto e lasciamo al retry manager il compito di riprovare.
  return out;
}
function scheduleBuildingMatch(){
  if(!baseReady)return;
  window.__buildingRetryCount=0;
  const tryWhenReady=()=>{ if(window.__buildingDone!==true) matchBuildingsComplete(); };
  // Primo tentativo solo quando MapLibre è davvero idle; fallback temporale per reti lente.
  map.once('idle',tryWhenReady);
  setTimeout(tryWhenReady,1800);
}
function metersBetween(a,b){
  const lat=(a[1]+b[1])*Math.PI/360, dx=(a[0]-b[0])*111320*Math.cos(lat), dy=(a[1]-b[1])*110540;
  return Math.hypot(dx,dy);
}
function rectAround(center,widthM,depthM){
  const [lon,lat]=center, dx=(widthM/2)/(111320*Math.cos(lat*Math.PI/180)), dy=(depthM/2)/110540;
  return {type:'Polygon',coordinates:[[[lon-dx,lat-dy],[lon+dx,lat-dy],[lon+dx,lat+dy],[lon-dx,lat+dy],[lon-dx,lat-dy]]]};
}
function makePlaceholders(unmatched){
  // Raggruppa solo civici senza edificio reale, dello stesso borgo e della stessa via.
  // Civici molto vicini possono quindi condividere un unico volume placeholder.
  const used=new Set(), features=[];
  for(let i=0;i<unmatched.length;i++){
    if(used.has(i))continue;
    const a=unmatched[i], group=[a]; used.add(i);
    let changed=true;
    while(changed){
      changed=false;
      for(let j=0;j<unmatched.length;j++){
        if(used.has(j))continue;
        const b=unmatched[j];
        if(borgoOf(b)!==borgoOf(a)||norm(viaOf(b))!==norm(viaOf(a)))continue;
        if(group.some(g=>metersBetween(g.coord,b.coord)<=16)){group.push(b);used.add(j);changed=true}
      }
    }
    const lon=group.reduce((z,r)=>z+r.coord[0],0)/group.length, lat=group.reduce((z,r)=>z+r.coord[1],0)/group.length;
    const b=borgoOf(a), n=group.length;
    // Dimensione moderatamente crescente per rendere leggibile un placeholder condiviso.
    const side=Math.min(16,8+Math.sqrt(n)*2.2), height=Math.min(15,7+Math.log2(n+1)*2.2);
    features.push({type:'Feature',geometry:rectAround([lon,lat],side,side*.78),properties:{borgo:b,via:viaOf(a),civico:group.map(r=>String(civOf(r))).join(', '),count:n,color:state.colors[b]||'#64748b',height}});
  }
  return features;
}
async function matchBuildingsComplete(){
  if(window.__buildingRunning)return; window.__buildingRunning=true;
  try{
    const buildings=await fetchBrandizzoBuildings();
    if(!buildings.length){
      // Stato normale durante il caricamento delle tile: niente toast e niente errore pubblico.
      // Riprova automaticamente, con attesa crescente, fino a quando le geometrie sono disponibili.
      window.__buildingRetryCount=(window.__buildingRetryCount||0)+1;
      const attempt=window.__buildingRetryCount;
      if(attempt<=14){
        const delay=Math.min(5000,700+attempt*300);
        setTimeout(()=>{ if(window.__buildingDone!==true) matchBuildingsComplete(); },delay);
      } else {
        // Ultimo fallback: manteniamo i placeholder/civici già disponibili e riproviamo
        // alla prossima fase idle della mappa, senza disturbare l'utente.
        map.once('idle',()=>{window.__buildingRetryCount=0;if(window.__buildingDone!==true)matchBuildingsComplete()});
      }
      return;
    }
    window.__buildingRetryCount=0;
    // Indice spaziale leggero: ogni civico confronta solo gli edifici nelle celle vicine,
    // invece di riesaminare l'intero Comune centinaia di volte.
    const CELL=0.00045, grid=new Map();
    const cellKey=(x,y)=>x+','+y;
    for(const f of buildings){
      const rings=f.geometry?.coordinates?.[0]||[]; if(!rings.length)continue;
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      for(const p of rings){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1])}
      const x0=Math.floor(minX/CELL),x1=Math.floor(maxX/CELL),y0=Math.floor(minY/CELL),y1=Math.floor(maxY/CELL);
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const k=cellKey(x,y);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(f)}
    }
    const nearbyBuildings=p=>{
      const cx=Math.floor(p[0]/CELL),cy=Math.floor(p[1]/CELL), seen=new Set(), a=[];
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const f of grid.get(cellKey(cx+dx,cy+dy))||[])if(!seen.has(f.id)){seen.add(f.id);a.push(f)}
      return a;
    };
    const out=new Map(), conflicts=new Set(), linkedCivics=new Set();
    for(const r of matchedRecords){
      const p=r.coord;
      let best=null,bestD=1e9;
      // Prima: edificio che contiene il punto civico. Poi: edificio più vicino entro 35 m.
      for(const f of nearbyBuildings(p)){
        if(geometryContains(p,f.geometry)){best=f;bestD=0;break}
        const d=geometryDistanceMeters(p,f.geometry);
        if(d<bestD){bestD=d;best=f}
      }
      if(!best||bestD>35)continue;
      const id=best.id, b=borgoOf(r), old=out.get(id);
      if(old&&old.borgo!==b){conflicts.add(id);out.delete(id);continue}
      if(conflicts.has(id))continue;
      if(!old)out.set(id,{borgo:b,color:state.colors[b]||'#64748b',height:9,base:0,geometry:best.geometry,civics:[]});
      out.get(id).civics.push({via:viaOf(r),civico:String(civOf(r))});
      linkedCivics.add(key(viaOf(r),civOf(r)));
    }
    const features=[];
    for(const [id,v] of out){
      if(conflicts.has(id))continue;
      const first=v.civics[0]||{};
      features.push({type:'Feature',id,geometry:v.geometry,properties:{borgo:v.borgo,via:first.via||'',civico:v.civics.map(x=>x.civico).join(', '),color:v.color,height:v.height,base:v.base}})
    }
    // Non disegnare il layer grigio originale sotto i volumi colorati: qui usiamo un filtro
    // geometrico completo OSM; per evitare z-fighting rendiamo la base grigia leggermente più bassa.
    try{map.setPaintProperty('brandizzo-base','fill-extrusion-height',['*',['coalesce',['get','render_height'],9],0.985])}catch(e){}
    map.getSource('matched-buildings').setData({type:'FeatureCollection',features});
    const unmatched=matchedRecords.filter(r=>!linkedCivics.has(key(viaOf(r),civOf(r))));
    const placeholders=makePlaceholders(unmatched);
    map.getSource('placeholder-buildings').setData({type:'FeatureCollection',features:placeholders});
    window.__buildingDone=true;
    console.info(`Copertura: ${matchedRecords.length}/${records.length} civici HTML · ${features.length} edifici reali · ${placeholders.length} placeholder (${unmatched.length} civici) · ${conflicts.size} conflitti`);
    document.getElementById('metaText').textContent='';
  }catch(e){
    // Gli errori tecnici di caricamento restano in console: la UI pubblica non mostra
    // messaggi invasivi. Un nuovo tentativo viene eseguito automaticamente.
    console.error('Building load retry:',e);
    window.__buildingRetryCount=(window.__buildingRetryCount||0)+1;
    const delay=Math.min(5000,900+window.__buildingRetryCount*350);
    setTimeout(()=>{if(window.__buildingDone!==true)matchBuildingsComplete()},delay);
  }finally{window.__buildingRunning=false}

let selectedSearchRecord=null;
function searchableText(r){return norm(viaOf(r)+' '+civOf(r)+' '+borgoOf(r))}
function searchMatches(raw){
  const q=norm(raw);if(!q)return [];

  const all=records.filter(r=>{const t=searchableText(r);return terms.every(x=>t.includes(x))});
  // Ordina per pertinenza, senza favorire l'ordine originale dell'Excel (che parte da Via Braida).
  const score=r=>{const v=norm(viaOf(r)),c=norm(civOf(r)),b=norm(borgoOf(r));let s=0;if(c===q)s+=100;if(v===q)s+=90;if(v.startsWith(q))s+=70;if(c.startsWith(q))s+=60;if(b.startsWith(q))s+=50;if(v.includes(q))s+=30;if(c.includes(q))s+=25;if(b.includes(q))s+=20;return s};
  all.sort((a,b)=>score(b)-score(a)||viaOf(a).localeCompare(viaOf(b),'it',{numeric:true})||String(civOf(a)).localeCompare(String(civOf(b)),'it',{numeric:true}));
  // Round-robin tra le vie: una ricerca generica (es. "via") mostra subito risultati da tutte le strade.
  const groups=new Map();for(const r of all){const k=norm(viaOf(r));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
  const out=[];let more=true;while(more&&out.length<30){more=false;for(const g of groups.values()){if(g.length){out.push(g.shift());more=true;if(out.length>=30)break}}}
  return out
}
function showSuggestions(){
  const box=document.getElementById('searchSuggestions'), val=document.getElementById('searchInput').value;
  const a=searchMatches(val); selectedSearchRecord=null;
  if(!norm(val)||!a.length){box.style.display='none';box.innerHTML='';return}
  box.innerHTML=a.map((r,i)=>`<button class="suggestion" data-i="${i}">${esc(viaOf(r))} ${esc(civOf(r))}<small>${esc(borgoOf(r))}</small></button>`).join('');box.style.display='block';
  box.querySelectorAll('.suggestion').forEach(btn=>btn.onclick=()=>{const r=a[+btn.dataset.i];document.getElementById('searchInput').value=`${viaOf(r)} ${civOf(r)}`;box.style.display='none';goToRecord(r)})
}

function mobileCloseBorghiForCard(){
  if(!window.matchMedia('(max-width:700px)').matches) return;
  const panel=document.getElementById('panel');
  panel.classList.add('closed');
  panel.classList.remove('mobile-search');
  document.body.classList.remove('mobile-searching');
  document.body.classList.add('popup-mode');
}
function markPopupForMobile(popup,activeId){
  if(!popup) return popup;
  mobileCloseBorghiForCard();
  const ids=['mobileBorghi','mobileSearch','mobileLocate'];
  ids.forEach(id=>document.getElementById(id)?.classList.toggle('is-active',id===activeId));
  popup.on('close',()=>{
    document.body.classList.remove('popup-mode');
    ids.forEach(id=>document.getElementById(id)?.classList.remove('is-active'));
  });
  return popup;
}
function goToRecord(r){
  const p=htmlPoints.get(key(viaOf(r),civOf(r)));if(!p){toast('Civico Excel presente ma senza coordinate nella mappa HTML');return}
  selectedSearchRecord=r; document.getElementById('searchSuggestions').style.display='none';document.getElementById('panel').classList.remove('mobile-search');document.body.classList.remove('mobile-searching');
  map.getSource('search-highlight')?.setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:p},properties:{}}]});
  map.flyTo({center:p,zoom:19,pitch:55,duration:800});
  markPopupForMobile(new maplibregl.Popup({offset:18,maxWidth:'330px'}).setLngLat(p).setHTML(civicPopupHTML({borgo:borgoOf(r),via:viaOf(r),civico:civOf(r),color:state.colors[borgoOf(r)]||'#64748b',kind:'Civico selezionato'})),'mobileSearch').addTo(map)
}
function search(){const a=searchMatches(document.getElementById('searchInput').value);if(!a.length){toast('Nessun civico trovato');return}goToRecord(a[0])}
map.on('load',()=>{setup();updateLegend();loadSource()});
document.getElementById('openSearch').onclick=()=>{const panel=document.getElementById('panel');document.getElementById('searchBox').classList.add('open');if(window.matchMedia('(max-width:700px)').matches){panel.classList.add('mobile-search');document.body.classList.add('mobile-searching')}setTimeout(()=>{const i=document.getElementById('searchInput');i.focus();try{i.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}},60)};document.getElementById('closeSearch').onclick=()=>{const panel=document.getElementById('panel');document.getElementById('searchBox').classList.remove('open');document.getElementById('searchSuggestions').style.display='none';panel.classList.remove('mobile-search');document.body.classList.remove('mobile-searching');if(window.matchMedia('(max-width:700px)').matches)panel.classList.remove('closed')};document.getElementById('doSearch').onclick=search;document.getElementById('searchInput').addEventListener('input',showSuggestions);document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search();if(e.key==='Escape')document.getElementById('searchSuggestions').style.display='none'});document.getElementById('toggleMenu').onclick=()=>{const panel=document.getElementById('panel');if(activeBorgo){clearBorgoFocus();panel.classList.remove('closed')}else{panel.classList.toggle('closed');document.getElementById('toggleMenu').textContent=panel.classList.contains('closed')?'Borghi':'Chiudi'}};document.getElementById('focusPill').onclick=clearBorgoFocus;document.getElementById('zoomInBtn').onclick=()=>map.zoomIn();document.getElementById('zoomOutBtn').onclick=()=>map.zoomOut();let userLocationMarker=null;
function distanceMeters(a,b){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const lat1=toRad(a[1]),lat2=toRad(b[1]),dLat=lat2-lat1,dLon=toRad(b[0]-a[0]);
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function nearestMappedCivic(point){
  let best=null,bestDistance=Infinity;
  for(const r of matchedRecords){
    if(!r.coord) continue;
    const d=distanceMeters(point,r.coord);
    if(d<bestDistance){best=r;bestDistance=d}
  }
  return best?{record:best,distance:bestDistance}:null;
}
document.getElementById('locateBtn').title='Mostra la tua posizione';
document.getElementById('locateBtn').onclick=()=>{
  mobileCloseBorghiForCard();
  document.getElementById('mobileLocate')?.classList.add('is-active');
  if(!navigator.geolocation){toast('Posizione non disponibile su questo dispositivo');return}
  const btn=document.getElementById('locateBtn');btn.disabled=true;btn.textContent='…';
  navigator.geolocation.getCurrentPosition(async pos=>{
    btn.disabled=false;btn.textContent='⌖';
    const p=[pos.coords.longitude,pos.coords.latitude];
    applyBorgoFocus(null);
    if(userLocationMarker) userLocationMarker.remove();
    const el=document.createElement('div');el.className='user-location-marker';
    userLocationMarker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(p).addTo(map);
    map.flyTo({center:p,zoom:17.2,pitch:55,duration:850});
    const accuracy=Math.round(pos.coords.accuracy||0);
    // Il caricamento dei civici HTML è asincrono: attendi brevemente prima di stimare il borgo.
    for(let i=0;i<20 && !matchedRecords.length;i++) await new Promise(resolve=>setTimeout(resolve,150));
    const nearest=nearestMappedCivic(p);
    const nr=nearest?.record;
    const borgo=nr?borgoOf(nr):'';
    const borgoColor=borgo?(state.colors[borgo]||'#007aff'):'#007aff';
    const nearestAddress=nr?`${viaOf(nr)} ${civOf(nr)}`:'';
    const nearestDistance=nearest?Math.round(nearest.distance):null;
    const lowAccuracy=accuracy>100;
    const borgoBlock=nr?`<span class="civic-chip"><span class="civic-chip-dot" style="background:${esc(borgoColor)}"></span>${esc(borgo)}</span><div class="civic-note">Stima basata sul civico mappato più vicino: <b>${esc(nearestAddress)}</b> · circa ${nearestDistance} m</div><div class="civic-note"><b>Vuoi una verifica più precisa?</b> Cerca direttamente il tuo civico nella barra di ricerca.</div>`:`<div class="civic-note">Borgo non determinabile: i civici non sono ancora disponibili. Riprova tra qualche secondo.</div>`;
    markPopupForMobile(new maplibregl.Popup({offset:22,maxWidth:'330px',className:'you-are-here'}).setLngLat(p).setHTML(`<div class="civic-card you-are-here${nr&&crestOf(borgo)?' has-crest':''}" style="--borgo-color:${esc(themeOf(borgo).primary)};--borgo-secondary:${esc(themeOf(borgo).secondary)}"><div class="civic-card-head"><span class="civic-accent"></span>${nr&&crestOf(borgo)?`<img class="civic-crest" src="${crestOf(borgo)}" alt="Stemma ${esc(borgo)}">`:''}<div class="civic-kicker">Posizione</div><div class="civic-title">Tu sei qui</div><div class="civic-address">${nr?`Borgo stimato: ${esc(borgo)}`:'Posizione rilevata dal dispositivo'}</div></div><div class="civic-card-body">${borgoBlock}</div></div>`)),'mobileLocate').addTo(map);
  },err=>{
    btn.disabled=false;btn.textContent='⌖';
    const msg=err&&err.code===1?'Per usare “Tu sei qui”, consenti l’accesso alla posizione nel browser.':'Non riesco a rilevare la posizione in questo momento.';
    toast(msg);
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
};

// v3.19 — keep the segmented mobile dock in sync with the current UI.
(function(){
  const nav=document.getElementById('mobileToolbar');
  const b=document.getElementById('mobileBorghi');
  const sbtn=document.getElementById('mobileSearch');
  const l=document.getElementById('mobileLocate');
  const panel=document.getElementById('panel');
  if(!nav||!b||!sbtn||!l||!panel) return;
  function syncMobileNav(){
    const searching=document.body.classList.contains('mobile-searching');
    const borghiOpen=!panel.classList.contains('closed')&&!panel.classList.contains('mobile-search');
    b.classList.toggle('is-active',borghiOpen&&!searching);
    sbtn.classList.toggle('is-active',searching);
    if(!searching&&!borghiOpen&&!document.body.classList.contains('popup-mode')) l.classList.remove('is-active');
  }
  const obs=new MutationObserver(syncMobileNav);
  obs.observe(panel,{attributes:true,attributeFilter:['class']});
  obs.observe(document.body,{attributes:true,attributeFilter:['class']});
  b.addEventListener('click',()=>setTimeout(syncMobileNav,0));
  sbtn.addEventListener('click',()=>setTimeout(syncMobileNav,0));
  l.addEventListener('click',()=>{l.classList.add('is-active')});
  syncMobileNav();
})();
