      const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});
      if(!r.ok)throw Error('HTTP '+r.status);
      const j=await r.json(), out=[];
      for(const e of j.elements||[]){
        if(e.type!=='way'||!e.geometry?.length)continue;
        const ring=e.geometry.map(n=>[n.lon,n.lat]);
        if(ring.length<4)continue;
        if(ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1])ring.push(ring[0]);
        out.push({id:'w'+e.id,geometry:{type:'Polygon',coordinates:[ring]},properties:e.tags||{}});
      }
      if(out.length)return out;
    }catch(e){lastErr=e;console.warn('Overpass',ep,e)}
  }
  throw lastErr||Error('Nessun edificio ricevuto');
}
function scheduleBuildingMatch(){
  if(!baseReady)return;
  const run=()=>matchBuildingsComplete();
  if(map.loaded()) map.once('idle',run); else map.once('load',run);
  setTimeout(()=>{if(window.__buildingDone!==true)matchBuildingsComplete()},2500);
}
function metersBetween(a,b){
  const lat=(a[1]+b[1])*Math.PI/360, dx=(a[0]-b[0])*111320*Math.cos(lat), dy=(a[1]-b[1])*110540;
  return Math.hypot(dx,dy);
}
function rectAround(center,widthM,depthM){
  const [lon,lat]=center, dx=(widthM/2)/(111320*Math.cos(lat*Math.PI/180)), dy=(depthM/2)/110540;
  return {type:'Polygon',coordinates:[[[lon-dx,lat-dy],[lon+dx,lat-dy],[lon+dx,lat+dy],[lon-dx,lat+dy],[lon-dx,lat-dy]]]};
}
function makePlaceholders(unmatched){
  // Raggruppa solo civici senza edificio reale, dello stesso borgo e della stessa via.
  // Civici molto vicini possono quindi condividere un unico volume placeholder.
  const used=new Set(), features=[];
  for(let i=0;i<unmatched.length;i++){
    if(used.has(i))continue;
    const a=unmatched[i], group=[a]; used.add(i);
    let changed=true;
    while(changed){
      changed=false;
      for(let j=0;j<unmatched.length;j++){
        if(used.has(j))continue;
        const b=unmatched[j];
        if(borgoOf(b)!==borgoOf(a)||norm(viaOf(b))!==norm(viaOf(a)))continue;
        if(group.some(g=>metersBetween(g.coord,b.coord)<=16)){group.push(b);used.add(j);changed=true}
      }
    }
    const lon=group.reduce((z,r)=>z+r.coord[0],0)/group.length, lat=group.reduce((z,r)=>z+r.coord[1],0)/group.length;
    const b=borgoOf(a), n=group.length;
    // Dimensione moderatamente crescente per rendere leggibile un placeholder condiviso.
    const side=Math.min(16,8+Math.sqrt(n)*2.2), height=Math.min(15,7+Math.log2(n+1)*2.2);
    features.push({type:'Feature',geometry:rectAround([lon,lat],side,side*.78),properties:{borgo:b,via:viaOf(a),civico:group.map(r=>String(civOf(r))).join(', '),count:n,color:state.colors[b]||'#64748b',height}});
  }
  return features;
}
async function matchBuildingsComplete(){
  if(window.__buildingRunning)return; window.__buildingRunning=true;
  try{
    toast('Carico edifici di Brandizzo…');
    const buildings=await fetchBrandizzoBuildings();
    // Indice spaziale leggero: ogni civico confronta solo gli edifici nelle celle vicine,
    // invece di riesaminare l'intero Comune centinaia di volte.
    const CELL=0.00045, grid=new Map();
    const cellKey=(x,y)=>x+','+y;
    for(const f of buildings){
      const rings=f.geometry?.coordinates?.[0]||[]; if(!rings.length)continue;
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      for(const p of rings){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1])}
      const x0=Math.floor(minX/CELL),x1=Math.floor(maxX/CELL),y0=Math.floor(minY/CELL),y1=Math.floor(maxY/CELL);
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const k=cellKey(x,y);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(f)}
    }
    const nearbyBuildings=p=>{
      const cx=Math.floor(p[0]/CELL),cy=Math.floor(p[1]/CELL), seen=new Set(), a=[];
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const f of grid.get(cellKey(cx+dx,cy+dy))||[])if(!seen.has(f.id)){seen.add(f.id);a.push(f)}
      return a;
    };
    const out=new Map(), conflicts=new Set(), linkedCivics=new Set();
    for(const r of matchedRecords){
      const p=r.coord;
      let best=null,bestD=1e9;
      // Prima: edificio che contiene il punto civico. Poi: edificio più vicino entro 35 m.
      for(const f of nearbyBuildings(p)){
        if(geometryContains(p,f.geometry)){best=f;bestD=0;break}
        const d=geometryDistanceMeters(p,f.geometry);
        if(d<bestD){bestD=d;best=f}
      }
      if(!best||bestD>35)continue;
      const id=best.id, b=borgoOf(r), old=out.get(id);
      if(old&&old.borgo!==b){conflicts.add(id);out.delete(id);continue}
      if(conflicts.has(id))continue;
      if(!old)out.set(id,{borgo:b,color:state.colors[b]||'#64748b',height:9,base:0,geometry:best.geometry,civics:[]});
      out.get(id).civics.push({via:viaOf(r),civico:String(civOf(r))});
      linkedCivics.add(key(viaOf(r),civOf(r)));
    }
    const features=[];
    for(const [id,v] of out){
      if(conflicts.has(id))continue;
      const first=v.civics[0]||{};
      features.push({type:'Feature',id,geometry:v.geometry,properties:{borgo:v.borgo,via:first.via||'',civico:v.civics.map(x=>x.civico).join(', '),color:v.color,height:v.height,base:v.base}})
    }
    // Non disegnare il layer grigio originale sotto i volumi colorati: qui usiamo un filtro
    // geometrico completo OSM; per evitare z-fighting rendiamo la base grigia leggermente più bassa.
    try{map.setPaintProperty('brandizzo-base','fill-extrusion-height',['*',['coalesce',['get','render_height'],9],0.985])}catch(e){}
    map.getSource('matched-buildings').setData({type:'FeatureCollection',features});
    const unmatched=matchedRecords.filter(r=>!linkedCivics.has(key(viaOf(r),civOf(r))));
    const placeholders=makePlaceholders(unmatched);
    map.getSource('placeholder-buildings').setData({type:'FeatureCollection',features:placeholders});
    window.__buildingDone=true;
    toast(`${matchedRecords.length}/${records.length} civici HTML · ${features.length} edifici reali · ${placeholders.length} placeholder (${unmatched.length} civici) · ${conflicts.size} conflitti`);
    document.getElementById('metaText').textContent=`Copertura: ${records.length} civici · ${matchedRecords.length} con coordinate · ${features.length} edifici reali · ${placeholders.length} placeholder (${unmatched.length} civici) · ${expandedFromStreet} recuperati da regole di via`;
  }catch(e){
    console.error(e);toast('Errore caricamento edifici completi: '+e.message);
  }finally{window.__buildingRunning=false}
}
let selectedSearchRecord=null;
function searchableText(r){return norm(viaOf(r)+' '+civOf(r)+' '+borgoOf(r))}
function searchMatches(raw){
  const q=norm(raw);if(!q)return [];
  const terms=q.split(' ').filter(Boolean);
  const all=records.filter(r=>{const t=searchableText(r);return terms.every(x=>t.includes(x))});
  // Ordina per pertinenza, senza favorire l'ordine originale dell'Excel (che parte da Via Braida).
  const score=r=>{const v=norm(viaOf(r)),c=norm(civOf(r)),b=norm(borgoOf(r));let s=0;if(c===q)s+=100;if(v===q)s+=90;if(v.startsWith(q))s+=70;if(c.startsWith(q))s+=60;if(b.startsWith(q))s+=50;if(v.includes(q))s+=30;if(c.includes(q))s+=25;if(b.includes(q))s+=20;return s};
  all.sort((a,b)=>score(b)-score(a)||viaOf(a).localeCompare(viaOf(b),'it',{numeric:true})||String(civOf(a)).localeCompare(String(civOf(b)),'it',{numeric:true}));
  // Round-robin tra le vie: una ricerca generica (es. "via") mostra subito risultati da tutte le strade.
  const groups=new Map();for(const r of all){const k=norm(viaOf(r));if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
  const out=[];let more=true;while(more&&out.length<30){more=false;for(const g of groups.values()){if(g.length){out.push(g.shift());more=true;if(out.length>=30)break}}}
  return out
}
function showSuggestions(){
  const box=document.getElementById('searchSuggestions'), val=document.getElementById('searchInput').value;
  const a=searchMatches(val); selectedSearchRecord=null;
  if(!norm(val)||!a.length){box.style.display='none';box.innerHTML='';return}
  box.innerHTML=a.map((r,i)=>`<button class="suggestion" data-i="${i}">${esc(viaOf(r))} ${esc(civOf(r))}<small>${esc(borgoOf(r))}</small></button>`).join('');box.style.display='block';
  box.querySelectorAll('.suggestion').forEach(btn=>btn.onclick=()=>{const r=a[+btn.dataset.i];document.getElementById('searchInput').value=`${viaOf(r)} ${civOf(r)}`;box.style.display='none';goToRecord(r)})
}
function goToRecord(r){
  const p=htmlPoints.get(key(viaOf(r),civOf(r)));if(!p){toast('Civico Excel presente ma senza coordinate nella mappa HTML');return}

  map.flyTo({center:p,zoom:19,pitch:55,duration:800});
  new maplibregl.Popup({offset:18,maxWidth:'330px'}).setLngLat(p).setHTML(civicPopupHTML({borgo:borgoOf(r),via:viaOf(r),civico:civOf(r),color:state.colors[borgoOf(r)]||'#64748b',kind:'Civico selezionato'})).addTo(map)
}
function search(){const a=searchMatches(document.getElementById('searchInput').value);if(!a.length){toast('Nessun civico trovato');return}goToRecord(a[0])}
